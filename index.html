<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<title>App Gianni – Palestra + Dieta Ultra</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  body { font-family: system-ui, -apple-system, sans-serif; background:#111; color:white; margin:0; }
  header { padding: 16px; background: #1f1f1f; color: white; text-align:center; }
  h1 { margin: 0; font-size: 20px; }
  nav { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; }
  nav button { flex: 1 1 45%; padding: 10px; border:none; border-radius:6px; background:#333; color:white; }
  section { display: none; padding: 12px; }
  section.active { display: block; }
  .card { background: #1b1b1b; border-radius: 6px; padding: 12px; margin-bottom:12px; }
  .card h3 { margin-top: 0; font-size: 16px; }
  label { display: block; font-size: 13px; margin-bottom: 4px; }
  input, textarea { width: 100%; padding: 6px; margin-bottom: 8px; border-radius:4px; border:none; }
  img { width: 100%; border-radius: 6px; margin-bottom: 8px; }
  .row { display: flex; gap: 8px; }
  .row > div { flex: 1; }
  .small { font-size: 12px; color: #aaa; }
</style>
</head>

<body>

<header>
  <h1>App Gianni – Palestra + Dieta Ultra</h1>
  <div class="small">GreenTheory • V-Shape • Lifestyle</div>
</header>

<nav>
  <button onclick="showSection('lunedi')">Lunedì</button>
  <button onclick="showSection('mercoledi')">Mercoledì</button>
  <button onclick="showSection('venerdi')">Venerdì</button>
  <button onclick="showSection('carichi')">Carichi</button>
  <button onclick="showSection('misure')">Misure</button>
  <button onclick="showSection('dieta')">Dieta</button>
  <button onclick="showSection('note')">Note</button>
</nav>

<section id="lunedi" class="active">
  <div class="card">
    <h3>Lunedì – Petto + Tricipiti</h3>
    <label>Chest Press</label>
    <input type="text" placeholder="Serie / Ripetizioni / Peso">
    <label>Pectoral Machine</label>
    <input type="text" placeholder="Serie / Ripetizioni / Peso">
    <label>Tricipiti Pushdown</label>
    <input type="text" placeholder="Serie / Ripetizioni / Peso">
  </div>
</section>

<section id="mercoledi">
  <div class="card">
    <h3>Mercoledì – Schiena + Bicipiti</h3>
    <label>Lat Machine</label>
    <input type="text" placeholder="Serie / Ripetizioni / Peso">
    <label>Rematore</label>
    <input type="text" placeholder="Serie / Ripetizioni / Peso">
    <label>Bicipiti Curl</label>
    <input type="text" placeholder="Serie / Ripetizioni / Peso">
  </div>
</section>

<section id="venerdi">
  <div class="card">
    <h3>Venerdì – Spalle + Core</h3>
    <label>Shoulder Press</label>
    <input type="text" placeholder="Serie / Ripetizioni / Peso">
    <label>Alzate Laterali</label>
    <input type="text" placeholder="Serie / Ripetizioni / Peso">
    <label>Crunch / Plank</label>
    <input type="text" placeholder="Durata / Ripetizioni">
  </div>
</section>

<section id="carichi">
  <div class="card">
    <h3>Carichi – Progressione</h3>
    <textarea rows="8" placeholder="Registra qui i tuoi carichi settimana per settimana"></textarea>
  </div>
</section>

<section id="misure">
  <div class="card">
    <h3>Misure corporee</h3>
    <label>Petto (cm)</label>
    <input type="number">
    <label>Vita (cm)</label>
    <input type="number">
    <label>Braccia (cm)</label>
    <input type="number">
    <label>Gambe (cm)</label>
    <input type="number">
  </div>
</section>

<section id="dieta">
  <div class="card">
    <h3>Dieta Ultra</h3>
    <textarea rows="10" placeholder="Inserisci la tua dieta giornaliera, pasti, orari, integrazione..."></textarea>
  </div>
</section>

<section id="note">
  <div class="card">
    <h3>Note personali</h3>
    <textarea rows="10" placeholder="Annotazioni, sensazioni, obiettivi, modifiche alla scheda..."></textarea>
  </div>
</section>

<script>
function showSection(id) {
  document.querySelectorAll("section").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
</script>

</body>
</html>
